spring:
  application:
    name: pokemon-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pokemon_db}
    username: ${DB_USER:pokemon}
    password: ${DB_PASSWORD:pokemon_dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration


app:
  jwt:
    secret: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
    expiration-minutes: 60

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
