spring:
  application:
    name: pokemon-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pokemon_db}
    username: ${DB_USER:pokemon}
    password: ${DB_PASSWORD:pokemon_dev}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
