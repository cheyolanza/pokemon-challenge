
services:

  postgres:
    image: postgres:16
    container_name: pokemon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pokemon_db
      POSTGRES_USER: pokemon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U pokemon -d pokemon_db
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./pokemon-backend
      dockerfile: Dockerfile
    container_name: pokemon-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pokemon_db
      SPRING_DATASOURCE_USERNAME: pokemon
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./pokemon-frontend
      dockerfile: Dockerfile
    container_name: pokemon-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
