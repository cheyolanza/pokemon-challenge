
services:
  postgres:
    image: postgres:16-alpine
    container_name: pokemon-postgres
    environment:
      POSTGRES_DB: pokemon_db
      POSTGRES_USER: pokemon
      POSTGRES_PASSWORD: pokemon_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokemon -d pokemon_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./pokemon-backend
      dockerfile: Dockerfile
    container_name: pokemon-backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/pokemon_db
      DB_USER: pokemon
      DB_PASSWORD: pokemon_dev
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
